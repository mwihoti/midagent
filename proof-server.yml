services:
  proof-server:
    # Pin to match @midnight-ntwrk/ledger-v8 (8.0.3). `latest` is 8.1.0, which
    # produces dust fee proofs the 8.0.3 node rejects (Custom error 170 =
    # InvalidDustSpendProof). Proof server and ledger must be on the same line.
    image: 'midnightntwrk/proof-server:8.0.3'
    command: ['midnight-proof-server', '-v', '--network', 'preprod']
    ports:
      - '127.0.0.1:6300:6300'
    environment:
      RUST_BACKTRACE: 'full'
    healthcheck:
      test: ['CMD-SHELL', 'echo > /dev/tcp/127.0.0.1/6300']
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
